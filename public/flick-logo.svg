<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="flickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Glow -->
  <path d="M256 32 C 140 32, 64 80, 64 210 C 64 340, 180 440, 256 480 C 332 440, 448 340, 448 210 C 448 80, 372 32, 256 32 Z" fill="url(#glowGrad)" />

  <!-- Outer Shield Border -->
  <path d="M256 44 C 150 44, 76 90, 76 210 C 76 328, 184 424, 256 462 C 328 424, 436 328, 436 210 C 436 90, 362 44, 256 44 Z" fill="none" stroke="url(#flickGrad)" stroke-width="8" stroke-linecap="round" filter="url(#shadowGlow)" />

  <!-- Inner Flame Symbol -->
  <g transform="translate(0, 10)">
    <!-- Main Outer Flame -->
    <path d="M256 120 Q 310 200, 310 270 A 54 54 0 0 1 202 270 Q 202 240, 220 210 Q 180 250, 180 300 A 76 76 0 0 0 332 300 Q 332 210, 256 120 Z" fill="url(#flickGrad)" />
    <!-- Inner Flame Wing -->
    <path d="M256 180 Q 290 230, 290 280 A 34 34 0 0 1 222 280 Q 222 260, 235 240 Q 205 270, 210 300 Q 256 360, 290 310 Q 300 250, 256 180 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
